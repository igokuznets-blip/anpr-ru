name: anpr-ru

# Камеры описываются в cameras.yml (cp cameras.example.yml cameras.yml).
# Масштабирование на несколько GPU/хостов — см. docker-compose.shards.example.yml

x-anpr: &anpr
  build: {context: ., dockerfile: anpr/Dockerfile}
  image: ${IMAGE_PREFIX:-anpr-ru}/anpr:${TAG:-latest}
  depends_on: [mediamtx]
  env_file: [{path: .env, required: false}]
  volumes:
    - ./models:/app/models:ro
    - ./data:/app/data
    - ./cameras.yml:/config/cameras.yml:ro
  restart: unless-stopped

services:
  mediamtx:
    image: bluenviron/mediamtx:1
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_HOST:-127.0.0.1}
    ports:
      - "${RTSP_PORT:-8554}:8554"
      - "8189:8189/udp"
    restart: unless-stopped

  anpr:
    <<: *anpr
    environment: &anpr-env
      ANPR_CAMERAS_FILE: /config/cameras.yml
      ANPR_ONLY: ${ANPR_ONLY:-}                  # пусто = все включённые камеры
      ANPR_SHARD: main
      ANPR_SOURCE_TEMPLATE: rtsp://mediamtx:8554/{id}
      ANPR_OUT_TEMPLATE: rtsp://mediamtx:8554/{id}_anpr
      ANPR_PLATE_MODEL: /app/models/plate.pt
      ANPR_CRNN_MODEL: /app/models/crnn.pt
      ANPR_OCR: ${ANPR_OCR:-easyocr}
      ANPR_DEVICE: ${ANPR_DEVICE:-cpu}
      ANPR_FPS: ${ANPR_FPS:-15}
      ANPR_MIN_VOTES: ${ANPR_MIN_VOTES:-3}

  web:
    build: {context: ., dockerfile: web/Dockerfile}
    image: ${IMAGE_PREFIX:-anpr-ru}/web:${TAG:-latest}
    depends_on: [mediamtx]
    env_file: [{path: .env, required: false}]   # для ${CAMx_URL} в cameras.yml
    volumes:
      - ./data:/data:ro
      - ./cameras.yml:/config/cameras.yml:ro
    environment:
      CAMERAS_FILE: /config/cameras.yml
      EVENTS_FILE: /data/events.jsonl
      SNAPS_DIR: /data/snaps
      STATUS_GLOB: /data/status-*.json
      MEDIAMTX_API: http://mediamtx:9997
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on: [web, mediamtx]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${HTTP_PORT:-8080}:80"]
    restart: unless-stopped

  # Демо без камеры: крутит samples/demo.mp4 в rtsp://mediamtx:8554/cam1 (у cam1 должен быть url: publisher)
  # docker compose --profile demo up -d
  demo:
    profiles: [demo]
    image: linuxserver/ffmpeg:latest
    depends_on: [mediamtx]
    volumes: ["./samples:/samples:ro"]
    command: >
      -re -stream_loop -1 -i /samples/demo.mp4 -an -c:v libx264 -preset veryfast
      -tune zerolatency -g 30 -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/cam1
    restart: unless-stopped
